name: stroke-risk-predictor tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies from pyproject
        run: uv sync

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Run tests with pytest and generate coverage
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd)/src uv run python -m pytest tests/ --cov=src --cov-report=term-missing
